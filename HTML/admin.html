<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TicketHub | Admin Sign In</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--FavIcon-->
    <link rel="icon" type="image/svg+xml" href="../media/tickets-two.svg">
    <!--css link-->
    <link rel="stylesheet" type="text/css" href="../CSS/style.css">
    <link rel="stylesheet" type="text/css" href="../CSS/sign_style.css">
</head>

<body>
    <!--Container-->
    <div class="container mt-5 d-flex justify-content-center align-items-center " style="height: auto; ">
        <div class=" rounded-5 shadow p-5  w-50 text-center" style="background-color: #F1F1F1;">
            <a href="../index.html" class="text-decoration-none  fs-5 fw-light mb-1 d-inline-block back-btn">← Back</a>
            <h1 class="fw-bold mb-5">ADMIN SIGN IN</h1>
            <!-- Form -->
            <form id="adminForm">
                <div class="mb-5 text-start">
                    <label class="form-label">
                        <img src="../media/Peoples.svg" style="margin-left:5px; margin-right:5px;">Username *
                    </label>
                    <input type="text" class="form-control rounded-pill ps-5 shadow" id="username" placeholder="Enter username" style="height: 50px;" required>
                </div>
                <div class="mb-5 position-relative text-start">
                    <label class="form-label">
                        <img src="../media/lock.svg" class="me-2">Password *
                    </label>
                    <input type="password" class="form-control rounded-pill ps-5 shadow" id="password" placeholder="Enter password" style="height: 50px;" required>
                    <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer;">
                        <img id="togglePassword" src="../media/close.svg" alt="Toggle Password" width="24">
                    </span>
                    <h5>&nbsp;</h5>
                </div>
                <button type="submit" class="btn w-75 rounded-4 fw-semibold shadow">
                    Admin Login
                </button>
                <p id="loginMessage" class="mt-3 fw-semibold"></p>
            </form>
        </div>
    </div>
<script>
document.getElementById("adminForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    if (username === "admin" && password === "123") {
        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "table.html";
        }, 1000);

    } else {
        message.style.color = "#ff2e63";
        message.textContent = "Invalid Admin Credentials!";
    }
});
</script>
</body>

</html>
