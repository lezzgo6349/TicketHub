<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TicketHub | Customer table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="../media/tickets-two.svg">
    <link rel="stylesheet" type="text/css" href="../CSS/style.css">
    <link rel="stylesheet" type="text/css" href="../CSS/homepage_style.css">
    <link rel="stylesheet" type="text/css" href="../CSS/table_style.css">
</head>

<body class="page-app">
    <header class="page-hero">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h1 class="mb-1 d-flex flex-wrap align-items-center gap-2">
                        Admin · Customers
                    </h1>
                    <p class="lead mb-0">Registered accounts and ticket records.</p>
                </div>
                <div class="admin-toolbar d-flex flex-wrap gap-2">
                    <a href="user_table.html?view=pending" class="btn btn-sm custom-btn rounded-4">Pending transactions <span id="adminPendingBadge" class="badge rounded-pill bg-warning text-dark d-none" title="Pending transactions awaiting review">0</span></a>
                    <a href="feedback.html" class="btn btn-sm custom-btn rounded-4">Feedbacks <span id="adminFeedbackBadge" class="badge rounded-pill bg-info text-dark d-none" title="New feedback submissions">0</span></a>
                    <a href="../index.html" id="logoutBtn" class="btn btn-sm btn-outline-light rounded-4">Sign out</a>
                </div>
            </div>
        </div>
    </header>
    <div class="container page-shell">
        <div class="table-wrap">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Customer name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Password</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="../JS/ticketStore.js"></script>
    <script src="../JS/table.js"></script>
</body>

</html>
