<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TicketHub | Sign Up</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--FavIcon-->
    <link rel="icon" type="image/svg+xml" href="../media/tickets-two.svg">
    <!--css link-->
    <link rel="stylesheet" type="text/css" href="../CSS/style.css">
    <link rel="stylesheet" type="text/css" href="../CSS/sign_style.css">
</head>

<body>
    <!--Container-->
    <div class="container mt-5 d-flex justify-content-center align-items-center " style="height: auto; ">
        <div class=" rounded-5 shadow p-5  w-50 text-center" style="background-color: #F1F1F1;">
            <a href="../index.html" class="text-decoration-none  fs-5 fw-light mb-1 d-inline-block back-btn">← Back</a>
            <h1 class="fw-bold mb-5">SIGN UP</h1>
            <!-- Form -->
            <form id="signupForm">
                <div class="mb-5 text-start">
                    <label for="username" class="form-label">
                        <img src="../media/Peoples.svg" class="me-2">Username *
                    </label>
                    <input type="text" class="form-control rounded-pill ps-5 shadow" id="username" name="username" placeholder="Enter username" style="height: 50px;" required>
                </div>
                <div class="mb-5 text-start">
                    <label for="lastname" class="form-label">
                        <img src="../media/Email.svg" class="me-2">Email *
                    </label>
                    <input type="text" class="form-control rounded-pill ps-5 shadow" id="contact" name="contact" placeholder="Enter email (eg.TicketHub@gmail.com)" style="height: 50px;" required>
                </div>
                <div class="mb-5 position-relative text-start">
                    <label for="password" class="form-label">
                        <img src="../media/lock.svg" class="me-2">Password *
                    </label>
                    <div class="position-relative">
                        <input type="password" class="form-control rounded-pill ps-5 pe-5 shadow" id="password" placeholder="Enter password " style="height: 50px;" required>
                        <img id="togglePassword" src="../media/close.svg" class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer; width:24px;">
                    </div>
                    <h6 id="passwordFeedback" class="fw-light mt-2 text-danger"></h6>
                </div>
                <!--Confirm Password-->
                <div class="mb-5 position-relative text-start">
                    <label for="confirmPassword" class="form-label">
                        <img src="../media/lock.svg" class="me-2">Confirm Password *
                    </label>
                    <div class="position-relative">
                        <input type="password" class="form-control rounded-pill ps-5 pe-5 shadow" id="confirmPassword" placeholder="Enter password again " style="height: 50px;" required>
                        <img id="toggleConfirmPassword" src="../media/close.svg" class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer; width:24px;">
                    </div>
                    <h6 id="confirmFeedback" class="fw-light mt-2 text-danger"></h6>
                </div>
                <button type="submit" class="btn w-75 rounded-4 fw-semibold shadow">
                    Create Account
                </button>
                <h6 id="emailExists" class="text-danger mt-2 text-center"></h6>
                <br><br>
                <h6 class="text-start">
                    Already have an Account?
                    <span><a href="signIn.html">Click here.</a></span>
                </h6>
            </form>
        </div>
    </div>
    <!--JS link-->
    <script src="../JS/signUp.js"></script>
</body>

</html>
